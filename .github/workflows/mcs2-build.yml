name: mcs2 构建（Windows / Linux）

on:
  push:
    branches: [mcs2-0.17]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 引导用的上游 Zig：本树是 0.17.1-dev（0.17.1 尚未发版），只能用 master
      - uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: 构建编译器（ReleaseFast）
        shell: bash
        env:
          # 关键：用**本树的** lib（含 mcs51/mcs251 目标定义），不是引导 zig 自带的
          ZIG_LIB_DIR: ${{ github.workspace }}/lib
        run: |
          zig version
          zig build -Doptimize=ReleaseFast -Dno-lib --summary all

      - name: 冒烟：用产物编一个示例
        shell: bash
        run: |
          BIN=$(ls zig-out/bin/zig* | head -1)
          echo "compiler: $BIN"
          cd examples/mcs51
          ZIG_LIB_DIR=$PWD/../../lib "$PWD/../../$BIN" build || true

      - uses: actions/upload-artifact@v4
        with:
          name: zig-mcs51-${{ matrix.name }}
          path: |
            zig-out/bin/zig*

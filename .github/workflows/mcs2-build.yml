name: mcs2 构建（Windows / Linux）

on:
  push:
    branches: [mcs2-0.17]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 引导：官方 0.17.0 发布版（本树已能直接用它自举）
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: 构建编译器（ReleaseFast）
        shell: bash
        env:
          ZIG_LIB_DIR: ${{ github.workspace }}/lib
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
        run: |
          zig version
          zig build -Doptimize=ReleaseFast -Dno-lib --summary all

      - name: 冒烟：用产物编示例
        shell: bash
        env:
          ZIG_LIB_DIR: ${{ github.workspace }}/lib
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
        run: |
          # Windows 上是 zig.exe（还有 zig.pdb），Linux 上是 zig —— 只取可执行文件
          BIN=$(ls zig-out/bin/zig.exe 2>/dev/null || ls zig-out/bin/zig)
          echo "compiler: $BIN"
          chmod +x "$BIN" 2>/dev/null || true
          cd examples/mcs51
          "$GITHUB_WORKSPACE/$BIN" build
          ls zig-out/asm | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: zig-mcs51-${{ matrix.name }}
          path: |
            zig-out/bin/zig
            zig-out/bin/zig.exe

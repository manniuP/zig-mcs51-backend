# devices/stc/stc8h8k64u.toml
# STC STC8H8K64U —— 1T 8051 核；8K SRAM / 64K Flash。
# 数据来源：STC8H-20260714 手册 + tools/vendor/stc/stc8h_SDCC_C51.h。
# 与 STC32/STC8051 外设互通（换内核/编译器即可）；与 AI8 外设**不**互通。

[device]
id = "stc/stc8h8k64u"
vendor = "STC"
family = "stc8"
model = "STC8H8K64U"
package = "LQFP48"
doc = "STC8H-20260714.md"
sfr_source = "../../tools/vendor/stc/keil/c51/STC8H.H"

# ---------------------------------------------------------------------------
# 代码空间：复位入口 0000H（经典布局），中断向量也在 0000 起。
# ---------------------------------------------------------------------------
[code]
base = 0x0000
size = 0x10000
addr_width = 16
movc = true
reset_vector = 0x0000
wait_states = 1

# ---------------------------------------------------------------------------
# 数据空间
# ---------------------------------------------------------------------------
[[memory]]
kind = "data"
base = 0x0000
size = 0x0080
addressing = "direct"
bit_addressable = true

[[memory]]
kind = "idata"
base = 0x0080
size = 0x0080
addressing = "indirect_r0"

[[memory]]
kind = "xdata"             # 片内扩展 RAM（8K），MOVX @DPTR，EXTRAM=0 时生效
base = 0x0000
size = 0x2000
addressing = "movx_dptr"
enable = "AUXR.EXTRAM"

[[memory]]
kind = "xdata_external"    # 片外 64K 总线（WR/RD/ALE），与片内逻辑地址重叠
base = 0x0000
size = 0x10000
addressing = "movx_dptr"
enable = "AUXR.EXTRAM"

[[memory]]
kind = "xfr"               # 扩展 SFR：16 位 MOVX 窗口 0FA00H~0FFFFH，与片外 RAM 重叠
base = 0xFA00
size = 0x0600
mode = "movx_dptr_overlap"
enable = "P_SW2.EAXFR"
conflicts_with = "xdata_external"

[[memory]]
kind = "eeprom"
base = 0x0000
size = 0x10000
page = 512
in_flash = true
iap = true

[stack]
space = "idata"
top = 0x00FF               # SP 初值（见 crt0）

[dptr]
count = 2                  # 双 DPTR：DPTR0/DPTR1，可自动增/减/切换
select = "AUXR1.DPS"

# ---------------------------------------------------------------------------
# 机制寄存器（最小集；完整表见 sfr_source）
# ---------------------------------------------------------------------------
[registers]
SP = 0x81
DPL = 0x82
DPH = 0x83
S4CON = 0x84
S4BUF = 0x85
AUXR = 0x8E
BUS_SPEED = 0xA1
P_SW2 = 0xBA
IAP_DATA = 0xC2
IAP_ADDRH = 0xC3
IAP_ADDRL = 0xC4
IAP_CMD = 0xC5
IAP_TRIG = 0xC6
IAP_CONTR = 0xC7
IAP_TPS = 0xF5

[register_bits]
"P_SW2.EAXFR" = 7
"AUXR.EXTRAM" = 1          # 0 = 片内扩展 RAM；1 = 片外

# XFR 内时钟寄存器（16 位 MOVX 地址，需 EAXFR=1）
[xfr]
CLKSEL = 0xFE00
CLKDIV = 0xFE01
HIRCCR = 0xFE02
XOSCCR = 0xFE03
IRC32KCR = 0xFE04
HSCLKDIV = 0xFE0B

# ---------------------------------------------------------------------------
# 中断：向量 = base + (num*8 + 3)；编号可 >31（需特殊处理）
# ---------------------------------------------------------------------------
[interrupts]
vector_base = 0x0000
slot_bytes = 8
formula = "num*8+3"
max_number = 67
priority_levels = 4
numbering = "linear_gt31"

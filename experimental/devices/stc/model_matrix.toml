# devices/stc/model_matrix.toml —— 机器可读型号表（由各家族选型表摘录）
#
# 用途：`python tools/mcs_device.py --expand devices/stc/model_matrix.toml --out-dir devices/stc/gen`
#       按模板生成每型号设备 TOML（同族寄存器/中断/xfr 复用 template）。
#
# 字段：
#   family    归属 families.toml
#   template  同族模板设备文件（相对本文件）
#   model     型号
#   flash     Flash 字节（code.size）
#   idata     idata 字节（缺省沿用模板，通常 0x100）
#   edata     edata 字节（仅 251 核）
#   xdata     内部扩展 SRAM 字节
#   eeprom    整数=专用 EEPROM 字节；"IAP"=与 Flash 共享
#   tags      能力标签（usb/touch/led/lcd/…），供 HAL 生成
#   source    出处
#
# 本文件只收录**已在手册选型表核对**的型号。一行一个型号。


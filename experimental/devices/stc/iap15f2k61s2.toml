# devices/stc/iap15f2k61s2.toml
# STC IAP15F2K61S2 —— 与 STC15 同路线（1T 增强 8051）；61K Flash / 2K RAM。
# 官方例程在 IAP15F2K61S2/官方例程_IAP15F2K61S2/。
# TODO：SFR 表与中断表待补 Keil 头/手册。

[device]
id = "stc/iap15f2k61s2"
vendor = "STC"
family = "stc15"
model = "IAP15F2K61S2"
package = "LQFP44 / PDIP40"
doc = "STC15-20260722.md"
# sfr_source = ""              # TODO: 待补 IAP15 Keil/SDCC 头

[code]
base = 0x0000
size = 0xF400                  # 61K
addr_width = 16
movc = true
reset_vector = 0x0000

[[memory]]
kind = "data"
base = 0x0000
size = 0x0080
addressing = "direct"
bit_addressable = true

[[memory]]
kind = "idata"
base = 0x0080
size = 0x0080
addressing = "indirect_r0"

[[memory]]
kind = "xdata"                 # 片内扩展（2K RAM - 256 idata ≈ 1792B）；基址待核
base = 0x0000
size = 0x0700
addressing = "movx_dptr"
enable = "AUXR.EXTRAM"

[[memory]]
kind = "eeprom"
base = 0x0000
size = 0xF400
page = 512
in_flash = true
iap = true

[stack]
space = "idata"
top = 0x00FF

[dptr]
count = 2

[interrupts]
vector_base = 0x0000
slot_bytes = 8
formula = "num*8+3"
max_number = 20                # TODO: 待手册确认
priority_levels = 2
numbering = "linear"

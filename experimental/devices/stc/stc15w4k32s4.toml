# devices/stc/stc15w4k32s4.toml
# STC15W4K32S4 —— 1T 增强 8051；32K Flash / 4K RAM（256 + 3840 片内 XRAM）。
# 定位：STC12 + 更多外设（新增 6 通道高精度 PWM、比较器等）。与 IAP15 同路线。
# TODO：SFR 表与中断表待补 Keil 头/手册 14、17。

[device]
id = "stc/stc15w4k32s4"
vendor = "STC"
family = "stc15"
model = "STC15W4K32S4"
package = "LQFP48"
doc = "STC15-20260722.md"
sfr_source = "../../tools/vendor/stc/keil/c51/STC15.H"

[code]
base = 0x0000
size = 0x8000                  # 32K
addr_width = 16
movc = true
reset_vector = 0x0000

[[memory]]
kind = "data"
base = 0x0000
size = 0x0080
addressing = "direct"
bit_addressable = true

[[memory]]
kind = "idata"
base = 0x0080
size = 0x0080
addressing = "indirect_r0"

[[memory]]
kind = "xdata"                 # 片内扩展 3840B，地址 0000H~0EFFH（手册 14.3.2）
base = 0x0000
size = 0x0F00
addressing = "movx_dptr"
enable = "AUXR.EXTRAM"
note = "0000H~0EFFH；>=0F00H 恒访问片外；MOVX @Ri 仅 0000H~00FFH"

[[memory]]
kind = "xdata_external"        # 片外 64K 数据总线（WR/RD/ALE）
base = 0x0000
size = 0x10000
addressing = "movx_dptr"

[[memory]]
kind = "eeprom"
base = 0x0000
size = 0x8000
page = 512
in_flash = true
iap = true

[stack]
space = "idata"
top = 0x00FF

[dptr]
count = 2

[interrupts]
vector_base = 0x0000
slot_bytes = 8
formula = "num*8+3"
max_number = 20                # TODO: 待手册确认
priority_levels = 2
numbering = "linear"
